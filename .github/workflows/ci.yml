# SkillVault 持续集成（CI）
# 成本约定（详见 docs/ci.md）：
# - 默认只用 ubuntu-latest（公开仓标准 runner 分钟免费）
# - 不要无 retention-days 地上传 artifact
# - 不要无意义地上 cache；用 cache 必须有 key
# - 日志会自动过期，一般不必手动删

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本 job 只读代码即可
permissions:
  contents: read

jobs:
  ci-tests:
    # Display name must match Ruleset required check (protect-main).
    name: CI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 在装依赖前先跑：防止以后 PR 偷偷加上昂贵 runner / 无过期时间的 artifact
      - name: Cost hygiene guard
        run: python .github/scripts/check_actions_cost_hygiene.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 若启用 cache: pip，依赖 actions/cache，会占每仓缓存额度；
          # 小项目安装很快，默认关闭。需要时再打开并接受缓存占用。
          # cache: pip

      # Node is required for web-artifacts-builder script smoke (node -v before usage check).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        # Full suite: skill script gate + CLI / vault gates
        run: python -m pytest tests/ -v

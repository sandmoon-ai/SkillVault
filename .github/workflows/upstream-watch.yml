# M4: weekly upstream drift check — never --apply; issues only.
name: Upstream watch

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cost hygiene guard
        run: python .github/scripts/check_actions_cost_hygiene.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Watch upstream (no apply)
        run: |
          set +e
          python cli/sv.py watch upstream --json-out upstream-report.json
          code=$?
          # 0 = clean, 2 = drift (still OK for job); other = fail
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Publish Issue if drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_watch_issue.py \
            --label upstream-drift \
            --title "[upstream-drift] registry skills changed vs vault" \
            --report upstream-report.json \
            --drift-key has_drift

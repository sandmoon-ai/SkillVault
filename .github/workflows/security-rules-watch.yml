# M5: monthly security rule source fingerprint check — never edits rules.
name: Security rules watch

on:
  schedule:
    - cron: "0 4 1 * *" # 1st of month 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-rules-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cost hygiene guard
        run: python .github/scripts/check_actions_cost_hygiene.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Watch security sources
        run: |
          set +e
          python cli/sv.py watch security-sources --json-out security-sources-report.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Publish Issue if sources changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/publish_watch_issue.py \
            --label security-rules \
            --title "[security-rules] upstream rule sources updated" \
            --report security-sources-report.json \
            --drift-key has_changes
